[package]
name = "niflib_animation"
version = "0.1.0"
description = "niflib ffi animation"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
cxx-build = { version = "1.0" }
bindgen = { version = "0.72.1" }
reqwest = { version = "0.13.4", features = ["blocking"] }
zip = { version = "8.6.0" }

[dependencies]
serde = { workspace = true }
snafu = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true, optional = true }


# kf
bitflags = { workspace = true }
cxx = { version = "1.0" }
winnow = { workspace = true }

# serde-hkx
havok_classes = { workspace = true, features = ["ignore_duplicates"] }
havok_serde = { workspace = true }
havok_types = { workspace = true, features = ["serde"] }
serde_hkx = { workspace = true }
serde_hkx_features = { workspace = true }
winnow_ext = { workspace = true }


# workspace members
serde_spline = { path = "../serde_spline" }

[dev-dependencies]
quick_tracing = { workspace = true }
serde_hkx = { workspace = true, features = ["tracing"] }
tracing = { workspace = true }
egui = "0.36"
eframe = "0.36"
sonic-rs = { version = "0.5.8" }

[features]
# default = [] # For debug

# Enable tracing logging
tracing = ["dep:tracing", "serde_hkx/tracing", "serde_spline/tracing"]


[lints]
workspace = true
