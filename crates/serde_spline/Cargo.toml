[package]
name = "serde_spline"
version = "0.1.0"
description = "Serialize/Deserialize B-spline"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license = "GPL-3.0"
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
bitflags = { workspace = true }
jwalk = { workspace = true }
rayon = { workspace = true }                    # Parallel
serde = { workspace = true }
snafu = { workspace = true }                    # Define all error patterns(with backtrace)
tracing = { workspace = true, optional = true }
winnow = { workspace = true }

# workspace members
havok_classes = { workspace = true, features = ["ignore_duplicates"] }
havok_serde = { workspace = true }
havok_types = { workspace = true, features = ["serde"] }
serde_hkx = { workspace = true }
serde_hkx_features = { workspace = true }
winnow_ext = { workspace = true }


[dev-dependencies]
quick_tracing = { workspace = true }
serde_hkx = { workspace = true, features = ["tracing"] }
tracing = { workspace = true }
egui = "0.36"
eframe = "0.36"
sonic-rs = { version = "0.5.8" }

[features]
# Enable tracing logging
tracing = ["dep:tracing", "serde_hkx/tracing"]


[lints]
workspace = true
