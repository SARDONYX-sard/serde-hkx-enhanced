[package]
name = "niflib_animation"
version = "0.1.0"
description = "niflib ffi animation"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license = "GPL-3.0"
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
cxx-build = { version = "1.0", optional = true }
bindgen = { version = "0.72.1", optional = true }
reqwest = { version = "0.13.4", features = ["blocking"], optional = true }
zip = { version = "8.6.0", optional = true }

[dependencies]
serde = { workspace = true }
snafu = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true, optional = true }


# kf
bitflags = { workspace = true, optional = true }
cxx = { version = "1.0", optional = true }
winnow = { workspace = true, optional = true }

# serde-hkx
havok_classes = { workspace = true, features = ["ignore_duplicates"] }
havok_serde = { workspace = true }
havok_types = { workspace = true, features = ["serde"], optional = true }
serde_hkx = { workspace = true }
serde_hkx_features = { workspace = true }
winnow_ext = { workspace = true }


# workspace members
serde_spline = { path = "../serde_spline" }

[dev-dependencies]
quick_tracing = { workspace = true }
serde_hkx = { workspace = true, features = ["tracing"] }
tracing = { workspace = true }
egui = "0.36"
eframe = "0.36"
sonic-rs = { version = "0.5.8" }

[features]
default = ["kf"] # For debug

# Enable tracing logging
tracing = ["dep:tracing", "serde_hkx/tracing", "serde_spline/tracing"]

# kf format
kf = [
  "dep:bitflags",
  "dep:cxx",
  "dep:havok_types",
  "dep:winnow",

  # build deps
  "dep:cxx-build",
  "dep:reqwest",
  "dep:zip",
]


[lints]
workspace = true
