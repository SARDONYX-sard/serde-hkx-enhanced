[package]
name = "serde_fbx"
version = "0.1.0"
description = "Convert FBX animations into Havok HKX animations."

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true


[dependencies]
rayon = { workspace = true }                    # Parallel
serde = { workspace = true }
snafu = { workspace = true }                    # Define all error patterns(with backtrace)
tracing = { workspace = true, optional = true }
ufbx = "0.11.3"

# serde-hkx
havok_types = { workspace = true, features = ["serde"] }
serde_hkx_features = { workspace = true }

# workspace members
serde_spline = { path = "../serde_spline" }
ufbx_write = { path = "../ufbx_write" }


[dev-dependencies]
eframe = "0.36"
egui = "0.36"
quick_tracing = { workspace = true }
serde_hkx = { workspace = true, features = ["tracing"] }
sonic-rs = { workspace = true }
tracing = { workspace = true }


[features]
# Enable tracing logging
tracing = ["dep:tracing", "serde_hkx/tracing", "serde_spline/tracing"]


[lints]
workspace = true
